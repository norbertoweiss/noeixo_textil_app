name: noeixo_textil_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  
  # Motores do Firebase para ligar ao banco de dados
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  firebase_storage: ^13.4.0
  video_player: ^2.11.1
  
  # Pacotes para o Módulo Comercial (APIs e GPS)
  http: ^1.2.0
  geolocator: ^11.0.0
  
  # Motor Cartográfico e Coordenadas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Motores de Cache Local para Blindagem do Mapa (TileLayer)
  flutter_map_cache: ^1.0.1
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_hive_store: ^3.2.0
  path_provider: ^2.1.2
  chewie: ^1.14.1
  youtube_player_flutter: ^9.1.3
  firebase_auth: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Motor de Injeção da Marca (Logo)
  flutter_launcher_icons: ^0.13.1

# ============================================================================
# CONFIGURAÇÃO DA IDENTIDADE VISUAL (NOEIXO)
# ============================================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_noeixo.png"
  web:
    generate: true
    image_path: "assets/icon_noeixo.png"

flutter:
  uses-material-design: true